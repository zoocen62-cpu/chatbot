<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <title>Mini Chat · AI와 나누는 대화</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="brand" href="/" aria-label="Mini Chat 홈"><span class="logo">✳</span><span>mini<span class="brand-light">chat</span></span></a>
      <button id="reset" class="reset" type="button">＋ 새 대화</button>
    </header>
    <main id="chat" class="chat">
      <section id="welcome" class="welcome">
        <div class="welcome-icon" aria-hidden="true">✳</div>
        <span class="eyebrow">A LITTLE CHAT, A NEW POSSIBILITY</span>
        <h1>무엇이든, 함께 생각해요.</h1>
        <p>작은 궁금증부터 새로운 아이디어까지.<br>당신의 이야기를 듣고 함께 답을 찾아갈게요.</p>
        <div class="suggestions">
          <button type="button" data-prompt="공부에 집중할 수 있는 방법 3가지를 알려 줘."><span>✎</span><strong>배움의 시작</strong><small>집중력을 높이는 공부 방법</small><span class="arrow">↗</span></button>
          <button type="button" data-prompt="평범한 일상에서 실천할 수 있는 창의적인 취미를 추천해 줘."><span>✧</span><strong>새로운 아이디어</strong><small>일상을 바꾸는 작은 영감</small><span class="arrow">↗</span></button>
          <button type="button" data-prompt="JavaScript를 처음 배우는 사람에게 변수와 함수를 쉽게 설명해 줘."><span>⌘</span><strong>코딩 도우미</strong><small>어려운 개념을 쉽게 이해하기</small><span class="arrow">↗</span></button>
        </div>
      </section>
      <div id="messages" class="messages" role="log" aria-label="대화 내용" aria-live="polite"></div>
    </main>
    <footer class="footer">
      <div id="error" class="error" role="alert" hidden></div>
      <form id="chat-form" class="composer">
        <label class="sr-only" for="input">메시지</label>
        <textarea id="input" rows="1" maxlength="6000" placeholder="어떤 이야기를 나누고 싶으세요?" required></textarea>
        <button id="send" type="submit" aria-label="메시지 보내기">↑</button>
      </form>
      <div class="footer-note"><span><i></i> GPT-4o mini</span><span>Enter로 전송 · Shift + Enter로 줄바꿈</span></div>
      <p class="disclaimer">AI의 답변은 부정확할 수 있어요. 중요한 정보는 한 번 더 확인해 주세요.</p>
    </footer>
  </div>
</body>
</html>
